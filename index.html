<style>
:root {
  --bg: #f4f6f9; --card: #ffffff; --ink: #1d2433; --muted: #5f6b7d; --line: #dde3ec;
  --accent: #0b5cad; --accent-ink: #ffffff; --accent-soft: #e6f0fb;
  --ok: #1e8a4c; --ok-soft: #e4f5ea; --bad: #c0392b; --bad-soft: #fbe9e7; --warn: #b26a00; --warn-soft: #fff4e0;
  --nav-done: #6b7686; --shadow: 0 1px 2px rgba(20,30,50,.06), 0 4px 16px rgba(20,30,50,.06);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12161d; --card: #1b212b; --ink: #e7ebf2; --muted: #9aa6b8; --line: #2c3442;
    --accent: #5aa2ec; --accent-ink: #0d1520; --accent-soft: #1d2d42;
    --ok: #4cc27f; --ok-soft: #173325; --bad: #ef7466; --bad-soft: #3a1f1c; --warn: #f0b04a; --warn-soft: #3a2c14;
    --nav-done: #8792a3; --shadow: none;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
button, input, select { font: inherit; color: inherit; }
a { color: var(--accent); }
header { background: var(--card); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20; }
.bar { max-width: 1100px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.brand { font-weight: 700; font-size: 18px; margin-right: auto; }
.brand small { color: var(--muted); font-weight: 500; margin-left: 6px; }
.pills { display: flex; gap: 6px; flex-wrap: wrap; }
.pill { border: 1px solid var(--line); background: transparent; padding: 6px 12px; border-radius: 999px; cursor: pointer; }
.pill.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
nav.tabs { max-width: 1100px; margin: 0 auto; padding: 0 16px; display: flex; gap: 2px; overflow-x: auto; }
.tab { border: 0; background: transparent; padding: 10px 14px; border-bottom: 3px solid transparent; cursor: pointer; white-space: nowrap; color: var(--muted); }
.tab.on { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 60px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; box-shadow: var(--shadow); margin-bottom: 16px; }
h2 { margin: 0 0 6px; font-size: 22px; } h3 { margin: 0 0 8px; font-size: 18px; }
.muted { color: var(--muted); } .small { font-size: 14px; }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--card); padding: 8px 16px; border-radius: 8px; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.danger { color: var(--bad); }
.btn.big { padding: 12px 22px; font-size: 17px; }
.btn:disabled { opacity: .5; cursor: default; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; border-right: 1px solid var(--line); background: transparent; padding: 7px 13px; cursor: pointer; }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--accent); color: var(--accent-ink); }
.rules { background: var(--accent-soft); border-radius: 10px; padding: 10px 14px; margin: 10px 0 16px; }
.field { margin: 12px 0; } .field > label { display: block; font-weight: 600; margin-bottom: 6px; }
select, input[type=number] { border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 7px 10px; }
.modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.mode { border: 1px solid var(--line); border-radius: 10px; padding: 12px; cursor: pointer; background: var(--card); text-align: left; }
.mode.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.mode b { display: block; }
/* exam */
.exam { display: grid; grid-template-columns: 1fr 260px; gap: 16px; align-items: start; }
@media (max-width: 820px) { .exam { grid-template-columns: 1fr; } .side { order: -1; } }
.side { position: sticky; top: 112px; }
.timer { font-variant-numeric: tabular-nums; font-size: 20px; font-weight: 700; border: 1px solid var(--bad); color: var(--bad); border-radius: 8px; padding: 6px 10px; text-align: center; }
.timer.calm { border-color: var(--line); color: var(--ink); }
.navgrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin: 12px 0; }
.navb { position: relative; height: 40px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); cursor: pointer; font-size: 14px; overflow: hidden; }
.navb.done::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 9px; background: var(--nav-done); }
.navb.cur { outline: 2px solid var(--ink); }
.navb.flag::before { content: ""; position: absolute; right: 0; top: 0; border-left: 10px solid transparent; border-top: 10px solid var(--bad); }
.navb.ok { background: var(--ok-soft); border-color: var(--ok); } .navb.ko { background: var(--bad-soft); border-color: var(--bad); }
.qhead { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 8px; }
.qtext { font-size: 17px; margin: 6px 0 14px; overflow-x: auto; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; cursor: pointer; background: var(--card); text-align: left; width: 100%; }
.opt:hover { border-color: var(--accent); }
.opt .lt { font-weight: 700; min-width: 20px; color: var(--muted); }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt .body { overflow-x: auto; flex: 1; }
.linkbtn { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0; }
.sol { margin-top: 12px; background: var(--warn-soft); border-radius: 8px; padding: 10px 12px; overflow-x: auto; }
.badge { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
.badge.ok { background: var(--ok-soft); color: var(--ok); } .badge.ko { background: var(--bad-soft); color: var(--bad); } .badge.bl { background: var(--line); color: var(--muted); }
.score { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
.score .big { font-size: 40px; font-weight: 800; }
.verdict { font-size: 20px; font-weight: 700; padding: 6px 14px; border-radius: 8px; }
.verdict.ok { background: var(--ok-soft); color: var(--ok); } .verdict.ko { background: var(--bad-soft); color: var(--bad); }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); font-size: 15px; vertical-align: middle; }
th { color: var(--muted); font-weight: 600; }
.tablewrap { overflow-x: auto; position: relative; }   /* relative: keeps KaTeX's hidden MathML inside the scroll box */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 14px; }
.stat { background: var(--bg); border-radius: 10px; padding: 10px 12px; } .stat b { display: block; font-size: 22px; }
.bars .barrow { display: grid; grid-template-columns: minmax(120px, 260px) 1fr 52px; gap: 10px; align-items: center; margin: 4px 0; font-size: 14px; }
.bars .track { height: 10px; background: var(--line); border-radius: 5px; overflow: hidden; } .bars .fill { height: 100%; background: var(--accent); }
/* written */
.ex { border-top: 1px solid var(--line); padding-top: 14px; margin-top: 14px; }
.ex:first-of-type { border-top: 0; margin-top: 0; padding-top: 0; }
.part { margin: 10px 0 10px 4px; }
.part .pq { overflow-x: auto; }
.grade { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 14px; }
.grade input { width: 72px; }
.drop { border: 2px dashed var(--line); border-radius: 12px; padding: 18px; text-align: center; cursor: pointer; }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.thumbs { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
.thumb { width: 110px; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--card); font-size: 12px; position: relative; }
.thumb img { width: 100%; height: 120px; object-fit: cover; display: block; cursor: zoom-in; }
.thumb .nm { padding: 4px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.thumb .x { position: absolute; top: 4px; right: 4px; border: 0; border-radius: 50%; width: 22px; height: 22px; background: rgba(0,0,0,.6); color: #fff; cursor: pointer; }
.filechip { height: 120px; display: flex; align-items: center; justify-content: center; font-weight: 700; color: var(--muted); }
.plot { width: 100%; max-width: 560px; height: auto; display: block; margin: 8px 0; background: var(--card); border: 1px solid var(--line); border-radius: 8px; }
.modal { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 20px; }
.modal .box { background: var(--card); border-radius: 12px; max-width: 980px; width: 100%; max-height: 90vh; overflow: auto; padding: 18px 20px; }
.modal img { max-width: 100%; max-height: 85vh; display: block; margin: 0 auto; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; z-index: 60; }
.formula h3 { margin-top: 22px; scroll-margin-top: 120px; } .formula table td, .formula table th { font-size: 14px; }
.fnav { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 4px; } .fnav .pill { font-size: 13px; padding: 4px 10px; }
.ftab td { vertical-align: middle; } .ftab td:first-child { white-space: normal; min-width: 180px; }
.ftab tr:nth-child(even) td { background: var(--bg); }
.formula .tablewrap + .tablewrap { margin-top: 16px; }
@media (max-width: 600px) { .formula h3 { scroll-margin-top: 170px; } }
.ptable { display: grid; grid-template-columns: repeat(18, minmax(34px, 1fr)); gap: 2px; min-width: 760px; }
.el { border: 1px solid var(--line); border-radius: 4px; padding: 2px; text-align: center; font-size: 10px; line-height: 1.2; background: var(--card); }
.el b { display: block; font-size: 13px; }
pre.code { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; overflow-x: auto; font: 14px/1.45 Consolas, "Cascadia Mono", Menlo, monospace; margin: 8px 0; }
code { font-family: Consolas, "Cascadia Mono", Menlo, monospace; }
.hidden { display: none !important; }
.kbd { border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; font-size: 13px; }
.acct { display: flex; align-items: center; gap: 8px; }
.acct-mail { max-width: 190px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
button.acct-mail { text-decoration: underline dotted; text-underline-offset: 3px; }
.mode:disabled { opacity: .55; cursor: default; }
.gbtn { width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 600; }
.orline { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; margin: 14px 0 4px; }
.orline::before, .orline::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.inp { width: 100%; border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 9px 11px; }
.inp:focus, .btn:focus-visible, .linkbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.gate { max-width: 620px; margin: 40px auto; }
.hero { padding: 28px 28px 24px; }
.hero h1 { margin: 0 0 10px; font-size: 30px; line-height: 1.2; }
.hero p { max-width: 720px; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin-bottom: 16px; }
.grid3 .card { margin-bottom: 0; } .grid3 h3 { margin-bottom: 4px; } .grid3 p { margin: 0; }
.urow { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 10px 0; border-top: 1px solid var(--line); }
.urow:first-of-type { border-top: 0; }
.uinfo { min-width: 0; overflow-wrap: anywhere; } .uacts { gap: 8px; }
@media (max-width: 600px) { .hero { padding: 20px 18px; } .hero h1 { font-size: 24px; } .gate { margin: 16px auto; } }
</style>
